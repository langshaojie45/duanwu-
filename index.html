<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端午安康 · 抖音风动态祝福</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-stage" aria-label="端午节动态祝福网页">
      <canvas id="sparkCanvas" aria-hidden="true"></canvas>

      <section class="reel-card">
        <div class="aurora" aria-hidden="true"></div>
        <div class="scanline" aria-hidden="true"></div>
        <div class="status-pill">端午限定祝福</div>

        <div class="danmaku-track" aria-hidden="true">
          <span>端午安康</span>
          <span>粽有好运</span>
          <span>高“粽”平安</span>
          <span>一键接福</span>
        </div>

        <header class="hero-copy">
          <p class="eyebrow">Dragon Boat Festival</p>
          <h1>粽有好运<br />为你划来</h1>
          <p class="subline">愿你今日有艾香，有甜粽，有满屏闪闪发光的好消息。</p>
        </header>

        <div class="scene" aria-hidden="true">
          <img class="zongzi zongzi-a" src="./assets/zongzi.svg" alt="" />
          <img class="zongzi zongzi-b" src="./assets/zongzi.svg" alt="" />
          <img class="zongzi zongzi-c" src="./assets/zongzi.svg" alt="" />
          <img class="boat" src="./assets/dragon-boat.svg" alt="" />
          <div class="wave wave-one"></div>
          <div class="wave wave-two"></div>
          <div class="wave wave-three"></div>
        </div>

        <section class="wish-panel" aria-live="polite">
          <span class="wish-label">今日祝福</span>
          <p id="wishText">愿你万事顺意，生活像甜粽一样，拆开都是惊喜。</p>
        </section>

        <div class="actions">
          <button id="launchBtn" class="primary-btn" type="button">开船送福</button>
          <button id="copyBtn" class="ghost-btn" type="button">复制祝福</button>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite">祝福已复制</div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
