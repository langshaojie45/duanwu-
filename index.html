<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端午安康 · 动态祝福</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-stage" aria-label="端午节动态祝福网页">
      <canvas id="sparkCanvas" aria-hidden="true"></canvas>

      <section class="festival-card" data-theme="jade">
        <div class="silk-bg" aria-hidden="true"></div>
        <div class="light-ring" aria-hidden="true"></div>

        <header class="topbar">
          <span id="modeLabel">端午 · 制作祝福</span>
          <div class="top-actions">
            <button id="themeBtn" class="icon-btn" type="button" aria-label="切换配色">色</button>
            <button id="danmakuBtn" class="icon-btn active" type="button" aria-label="开关弹幕">弹</button>
          </div>
        </header>

        <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true">
          <span>平安顺遂</span>
          <span>粽有好运</span>
          <span>一举高粽</span>
          <span>喜乐安康</span>
        </div>

        <section class="hero">
          <p class="eyebrow">Dragon Boat Festival</p>
          <h1>端午安康</h1>
          <p class="hero-line"><span id="recipientName">你</span>，愿今夏的风把好运都吹到你身边。</p>
        </section>

        <section class="river-scene" aria-label="端午动态场景">
          <button class="tap-zongzi tap-a" type="button" data-charm="甜粽" aria-label="拆开甜粽祝福">
            <img src="./assets/zongzi.svg" alt="" />
          </button>
          <button class="tap-zongzi tap-b" type="button" data-charm="艾草" aria-label="领取艾草祝福">
            <img src="./assets/zongzi.svg" alt="" />
          </button>
          <button class="tap-zongzi tap-c" type="button" data-charm="龙舟" aria-label="开启龙舟祝福">
            <img src="./assets/zongzi.svg" alt="" />
          </button>
          <img class="boat" src="./assets/dragon-boat.svg" alt="" />
          <div class="moon"></div>
          <div class="river river-one"></div>
          <div class="river river-two"></div>
          <div class="river river-three"></div>
        </section>

        <section class="control-deck">
          <label class="name-field" for="nameInput">
            <span id="nameLabel">写给谁</span>
            <input id="nameInput" type="text" maxlength="8" placeholder="输入名字" autocomplete="off" />
          </label>

          <div class="mode-tabs" aria-label="祝福风格">
            <button class="mode-tab active" type="button" data-mode="sweet">甜一点</button>
            <button class="mode-tab" type="button" data-mode="lucky">好运签</button>
            <button class="mode-tab" type="button" data-mode="bold">燃一点</button>
          </div>

          <article class="wish-card" aria-live="polite">
            <span id="fortuneTag">今日福签</span>
            <p id="wishText">愿你万事顺意，生活像甜粽一样，拆开都是惊喜。</p>
          </article>

          <div class="action-grid">
            <button id="launchBtn" class="primary-btn" type="button">生成祝福</button>
            <button id="fortuneBtn" class="secondary-btn" type="button">抽好运签</button>
            <button id="copyBtn" class="secondary-btn wide" type="button">复制专属链接</button>
          </div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite">祝福已复制</div>

        <div id="fortuneReveal" class="fortune-reveal" aria-hidden="true">
          <div class="fortune-glow"></div>
          <div class="fortune-stick">
            <span id="fortuneStickText">端午安康好运靠岸</span>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
